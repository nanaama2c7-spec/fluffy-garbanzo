<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUXE | Luxury Fashion & Accessories</title>

    <style>
        /* =========================
           GENERAL STYLES
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f5ef;
            color: #251710;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        img {
            width: 100%;
            display: block;
        }

        .container {
            width: 90%;
            max-width: 1250px;
            margin: auto;
        }

        .gold {
            color: #c9a227;
        }

        .btn {
            display: inline-block;
            padding: 15px 32px;
            background: #c9a227;
            color: #21130d;
            font-weight: bold;
            border-radius: 3px;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            transform: translateY(-3px);
        }

        .section-title {
            text-align: center;
            margin-bottom: 55px;
        }

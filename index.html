
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VÉLORA LUXE | Luxury Fashion</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f5ef;
      color: #241c16;
    }

    /* HEADER */
    header {
      background: #241c16;
      color: white;
      padding: 20px 6%;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a:hover {
      color: #b83b35;
    }
